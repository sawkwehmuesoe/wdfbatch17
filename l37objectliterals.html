<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Object Literals (Javascript)</title>
    </head>
    <body>

        

        <script type="text/javascript">
        
            let students = {
                firstname : "Ya",
                middlename : "Min",
                lastname : "Oo",
                age: 22
            };

            console.log(students);
            console.info(students); 

            console.table(students);
            console.log(typeof students);

            console.log(students.firstname);
            console.log(students.middlename);
            console.log(students.lastname);
            console.log(students.age);

            console.log(typeof students.firstname); // string
            console.log(typeof students.age); // number



            const persons = {
                firstname : "chaw chaw",
                lastname : "san",
                age : 25 ,
                single : false,
                email : "chawchaw@gmail.com",
                address : {
                    street : "19st",
                    townshipt : "alone"
                },
                hometown:{
                    city: "Yangon"
                },
                hobbies : ['sleep',"eat","code","music","sport"]
            }

            console.log(persons);
            console.table(persons);

            console.log(persons.firstname);
            console.log(persons.age);
            console.log(persons.single);
            console.log(persons.hometown.city);

            console.log(persons.address);
            console.log(persons.address.street);
            console.log(persons.address.townshipt);

            console.log(persons.hobbies);
            console.log(persons.hobbies[2]);
            console.log(persons.hobbies[4]);
            console.log(persons.hobbies.length);
            console.log(persons.hobbies[5-1]);
            console.log(persons.hobbies[persons.hobbies.length-1]);
  
        </script>

    </body>
</html>
