<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Date and Time</title>
    </head>
    <body>

        <div>
            <small><span id="autoyear"></span></small>
        </div>

        <script type="text/javascript">
            
            let mydate = new Date(); // class Object

            console.log(mydate); //Fri Aug 21 2026 15:06:30 GMT+0700 (Indochina Time)
            console.log(typeof mydate); // object
            console.log(new Date()); //Fri Aug 21 2026 15:06:30 GMT+0700 (Indochina Time)

            
            console.log(new Date().getDate()); // 21 

            let getdate = mydate.getDate();
            console.log(getdate); // 21 

            let hour =new Date().getHours();
            console.log(hour);

            let minute = mydate.getMinutes();
            console.log(minute);

            let second = mydate.getSeconds();
            console.log(second);

            // 1s = 1000ms 
            let millisecond = mydate.getUTCMilliseconds();
            console.log(millisecond);

            // 1s = 1000ms  ( Unix OS )
            // 1 jan 1970 > uptonow ( tunestamp )
            let time = mydate.getTime();
            console.log(time); // 1787304907679 

            let now = Date.now();
            console.log(now);

            let month = mydate.getMonth();
            console.log(month); // 3 

            let day = mydate.getDay();
            console.log(day); // 3 

            let year = mydate.getFullYear();
            console.log(year); // 2026

            // Coordinate Universal Time  
            let utcyear = mydate.getUTCFullYear();
            console.log(utcyear); // 2026


            // document.getElementById('autoyear').textContent = utcyear;
            // document.getElementById('autoyear').innerText = utcyear;
            document.getElementById('autoyear').innerHTML = utcyear;

            // m d y h:m:s 
            let birthday = new Date('7-10-2020'); // Fri Jul 10 2020 00:00:00 GMT+0700 (Indochina Time)
                birthday = new Date("8-1-2020 11:35:01"); // Fri Jul 10 2020 00:00:00 GMT+0700 (Indochina Time) 
                birthday = new Date("Aug-2-2023 11:35:01"); //Wed Aug 02 2023 11:35:01 GMT+0700 (Indochina Time)
                birthday = new Date("Aug 3 2023 11:35:01");
                birthday = new Date("July 1 2024 11:35:01");
                birthday = new Date("5/10/2024 11:35:01")
                
            console.log(birthday); 
            console.log(birthday.getMonth()); // 4 

            birthday.setMonth(2); // Sun Mar 10 2024 11:35:01 GMT+0700 (Indochina Time) 
            birthday.setDate(15); // Fri Mar 15 2024 11:35:01 GMT+0700 (Indochina Time) 
            birthday.setFullYear(2025); //Sat Mar 15 2025 11:35:01 GMT+0700 (Indochina Time)

            birthday.setHours(15);
            birthday.setMinutes(10);
            birthday.setSeconds(59); // Sat Mar 15 2025 15:10:59 GMT+0700 (Indochina Time)

            console.log(birthday); 




        </script>

    </body>
</html>
