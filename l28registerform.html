<!DOCTYPE html>
<html>
    <head>
        <title>Register Form</title>
        <link rel="icon" href="./img/fav/logo.png" type="image/png" sizes="32x32" >
        
        <link href="./css/l28registerform.css" rel="stylesheet" type="text/css" />
      
    </head>
    <body>

        <div class="container">

            <h2>Register with us</h2>

            <form class="form" action="" method="">

                <div class="form-group">
                    <label for="username">User Name</label>
                    <input type="text" name="username" class="form-control" id="username" class="form-control" placeholder="Enter Username" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" name="email" class="form-control" id="email" class="form-control" placeholder="Enter Email" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" class="form-control" id="password" class="form-control" placeholder="Enter Password" autocomplete="off" />
                </div>

                <div class="form-group">
                    <label for="cfmpassword">Confirm Password</label>
                    <input type="password" name="cfmpassword" class="form-control" id="cfmpassword" class="form-control" placeholder="Enter Comfirm Password" autocomplete="off" />
                </div>

                <button type="button" class="btn">Submit</button>

            </form>

        </div>

        

    </body>
</html>
