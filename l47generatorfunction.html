<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Generator Function</title>
    </head>
    <body>

        

        <script type="text/javascript">

            // (A) Default Function | System Function 
            // (B) User Define Function 

                    // (1) Regular Function 
                            // (i) Manual Function
                            // (ii) Parameter Function
                                // (a) Single Parameter
                                // (b) Multi Parameter
                    
                    // (2) Arrow Function 
                            // (i) Manual Function
                            // (ii) Parameter Function
                                // (a) Single Parameter
                                // (b) Multi Parameter

                    // (3) Generator Function


            
            // function name(){
            //     code to be executes (i) print or (ii) return
            // }

            // name(); function invoke /  function recall


            // (i) Regular Function

            function test1(){
                return 10;
            }

            console.log(test1()); // 10
            console.log(test1()); // 10
            console.log(test1()); // 10

            function test2(){
                let x=1;
                x++;
                return x;
            }

            console.log(test2());
            console.log(test2());
            console.log(test2());



            let y = 1;

            function test3(){
                y++;
                return y;
            }

            console.log(test3()); // 2
            console.log(test3()); // 3
            console.log(test3()); // 4

            // (3) Generator Function 

            function* genfun(){
                // yield 1;

                yield 1;
                yield 2;
                yield 3;

            }

            // console.log(genfun()); // genfun {<suspended>}[[GeneratorLocation]]: l47generatorfunction.html:77[[Prototype]]: Generator[[GeneratorState]]: "suspended"[[GeneratorFunction]]: ƒ* genfun()[[GeneratorReceiver]]: Window[[Scopes]]: Scopes[3]
            // console.log(genfun().next()); // {value: 1, done: false}
            // console.log(genfun().next().value); // 1
            // console.log(genfun().next().value); // 1
            // console.log(genfun().next().value); // 1
         
            const getgenfun = genfun();
            console.log(getgenfun);
            console.log(getgenfun.next()); // {value: 1, done: false}
            console.log(getgenfun.next()); // {value: 1, done: false}
            console.log(getgenfun.next()); // {value: 1, done: false}
            console.log(getgenfun.next()); // {value: undefined, done: true}

            
            console.log(getgenfun);
            console.log(getgenfun.next().value); // 1
            console.log(getgenfun.next().value); // 2
            console.log(getgenfun.next().value); // 3
            console.log(getgenfun.next().value); // underfined
            console.log(getgenfun.next().value); // underfined

        </script>

    </body>
</html>
