<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Image to PDF</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.css" integrity="sha512-4wfcoXlib1Aq0mUtsLLM74SZtmB73VHTafZAvxIp/Wk9u1PpIsrfmTvK0+yKetghCL8SHlZbMyEcV8Z21v42UQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
        <link href="./css/l55imgtopdfexport.css" rel="stylesheet" type="text/css" />
   
    </head>
    <body>

        <div class="container">

            <img src="./img/hello/uploads.png" id="display" class="display" alt="display" />

            <div class="btncontainer">

                <label for="fileinput" class="uploadbtn">
                    Upload Image
                    <input type="file" name="fileinput" id="fileinput" class="fileinput" accept=".png,.jpg,.jpeg" />
                </label>

                <button class="downloadbtn" onclick="pdfloader()" >Download PDF</button>

            </div>          

        </div>
        
        <script src="./libs/jspdf/dist/jspdf.umd.min.js" type="text/javascript"></script>
        <script src="./js/l55imgtopdfexport.js" type="text/javascript"></script>

    </body>
    
</html>
