<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Jquery Quiz App</title>
        <link rel="stylesheet" href="./css/l58quizapp.css">

    </head>
    <body class="">

        <div class="container">

            <button id="themetoggle">Theme</button>

            <h3>Quiz App</h3>

            <div id="quizcontainer">
                <p id="question">Question ? </p>

                <div class="options">
                    <button type="button" class="optionbtn">Sample Options 1</button>
                    <button type="button" class="optionbtn">Sample Options 2</button>
                    <button type="button" class="optionbtn">Sample Options 3</button>
                    <button type="button" class="optionbtn">Sample Options 4</button>
                </div>
            </div>

            <button type="button" class="nextbtn">Next</button>

            <div id="result">
                <h3>Your Score: 0/3</h3>
                <button type="button" id="restartbtn">Restart</button>
            </div>

        </div>
        
        
        <!-- <script src="https://code.jquery.com/jquery-4.0.0.js" type="text/javascript"></script> -->
        <script src="./libs/jquery-4.0.0.js" type="text/javascript"></script>
        <script src="./js/l58quizapp.js" type="text/javascript"></script>
        

    </body>
    
</html>
