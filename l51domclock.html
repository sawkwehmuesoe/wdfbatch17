<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>DOM (Document Object Model) Clock</title>

        <style type="text/css">

            body{
                height: 100vh;

                display: flex;
                justify-content: center;
                align-items: center;
            }
         
        </style>
    </head>
    <body>


        <h3 id="display">00 : 00 : 00 AM Sunday</h3>

      

        <script type="text/javascript">
        
            const getdisplay = document.getElementById("display");

            const days = ['Sunday','Monday','Tuesday',"Wednesday","Thursday","Friday","Staturday"];
            // console.log(days);
            // console.log(days[5]);

            // console.log(getdisplay);
            
            function startclock(){

                const getdate = new Date();
                // console.log(getdate);

                let gethours = getdate.getHours();
                // console.log(gethours);

                let getminutes = getdate.getMinutes();
                // console.log(getminutes);

                let getseconds = getdate.getSeconds();
                // console.log(getseconds);

                let getday = getdate.getDay();
                // console.log(getday);
                // console.log(days[getday]); // Saturday 

                // let getampm = gethours < 12 ? "AM" : "PM";

                switch(gethours >= 12){
                    case true :
                        getampm = "PM";
                        gethours = gethours - 12;
                        break; 
                    case false:
                        getampm = "AM"
                        gethours = gethours - 12;
                        break
                }

                let setclock = `${gethours} : ${getminutes} : ${getseconds} ${getampm} ${days[getday]}`;

                getdisplay.textContent = setclock; 

            }

            startclock();

            // 1s = 1000ms  

            setInterval(startclock,1000);
            

        </script>

    </body>
</html>
