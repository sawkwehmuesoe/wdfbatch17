<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 , Row and Column</title> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="">

        <div class="container">
            <h1>Row and Column</h1>
        </div>

        <div class="container-fluid">
            <div class="row">
                <h1 class="bg-primary text-light col-6">Hello Yangon</h1>
                <h1 class="bg-secondary text-light col-7">Hello Mandalay</h1>
                <h1 class="bg-success text-light col-2">Hello Bago</h1>
                <h1 class="bg-info text-light col">Hello Mawlamyine</h1>
                <h1 class="bg-warning text-light col-10">Hello Yay</h1>
                <h1 class="bg-danger text-light col-2">Hello Pyinoolwin</h1>
            </div>            
        </div>

        <hr>

        <div class="container-fluid">

            <div class="row">

                <div class="bg-primary text-light col-6">
                    <div class="row">
                        <div class="bg-success col-xxl-3 col-xl-4 col-lg-6 col-sm-12">Col 1 - div1</div>
                        <div class="bg-success col-xxl-3 col-xl-4 col-lg-6 col-sm-12">Col 1 - div2</div>
                        <div class="bg-success col-xxl-3 col-xl-4 col-lg-6 col-sm-12">Col 1 - div3</div>
                        <div class="bg-success col-xxl-3 col-xl-4 col-lg-6 col-sm-12">Col 1 - div4</div>
                        <div class="bg-success col-xxl-3 col-xl-4 col-lg-6 col-sm-12">Col 1 - div5</div>
                        <div class="bg-success col-xxl-3 col-xl-4 col-lg-6 col-sm-12">Col 1 - div6</div>
                    </div>
                </div>

                <div class="bg-primary text-light col-6">
                    <div class="row">
                        <div class="bg-success col-md-6">Col 2 - div1</div>
                        <div class="bg-success col-md-6">
                            <div class="row">
                                <div class="bg-info col-md-6">Col 2 -div2- div1</div>
                                <div class="bg-success col-md-6">Col 2 -div2- div1</div>
                            </div>
                        </div>
                        
                </div>

            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    
</html>
