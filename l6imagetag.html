<html>
    <head>
        <title>Image Tag</title>
    </head>
    <body>
        
        <h3>Image Tag - External</h3>

        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJKXTKCOD06zvI25L2Ysi98efTNTJZrCeRZBwPFHVIURRmDexJXgt5dqw&s=10" alt="online cat1"/>
        <img src="https://media.tenor.com/MKkJWYigjycAAAAe/cute-cat-cat-cute.png" alt="online cat2"/>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRnDcm4lBm5_snJva8OQgt6ypWxM5yUTOJsdhqC5fQSI_Z-P9JlH4Wy4Hs&s=10" alt="online cat3" width="200px" height="200">
        
        <h3>Image Tag - Internal</h3>

        <!-- path/filename/format -->
        <img src="./img/hello/dog1.jpg" alt="offline dog1" width="200px">
        <img src="./img/hello/dog2.jpg" alt="offline dog2" width="200px">

        <a href="./img/hello/dog2.jpg">
            <img src="./img/hello/dog2.jpg" alt="offline dog2" width="200">
        </a>

    </body>
</html>
