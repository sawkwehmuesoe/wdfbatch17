<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 Badge</title> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="">

        <div class="container">
            
           <h3>Badge</h3>

           <button type="button" class="btn btn-primary">Notification <span class="badge text-bg-danger">5</span></button>

           <hr/>

            <span class="badge text-bg-primary rounded-0">primary</span>
            <span class="badge text-bg-secondary rounded">secondary</span>
            <span class="badge text-bg-success rounded-pill">success</span>
            <span class="badge text-bg-info">info</span>
            <span class="badge text-bg-warning">warning</span>
            <span class="badge text-bg-danger">danger</span>
            <span class="badge text-bg-light">light</span>
            <span class="badge text-bg-dark">dark</span>

            <hr>

            
        <b>Add Card</b><sup class="badge text-bg-secondary">5</sup>

        <br/><br/><br/>

        <b>Special Discount</b><sub class="badge text-bg-secondary">5%</sub>


        </div>

        <!-- 
        sup = superscript 
        sub = subcript
        -->

        
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    
</html>
