<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 , Form </title> 
        <!-- bootstrap css1 js1 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

        <!-- select2 css1 js1 -->
        <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css" rel="stylesheet"/>

         <!--flatpicker css1 js1  -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

        <!-- summer css1 js1 -->
        <link href="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.css" rel="stylesheet">
       
    </head>
    <body class="">

        <div class="container">

            <h1>Bootstrap Form Elements</h1>

            <form action="" method="" enctype="Multipart/form-data" >

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="firstname" class="form-label">First Name</label>
                        <input type="text" name="firstname" id="firstname" class="form-control form-control-lg rounded-0" placeholder="Enter Your Firstname" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="lastname" class="form-label">Last Name</label>
                        <input type="text" name="lastname" id="lastname" class="form-control form-control-md rounded-0" placeholder="Enter Your Lastname" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" name="age" id="age" class="form-control form-control-sm rounded-0" placeholder="Enter Your Age" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" name="email" id="email" class="form-control rounded-0" placeholder="Enter Your Email" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" name="password" id="password" class="form-control rounded-0" placeholder="Enter Your Password" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="color" class="form-label">Color Picker</label>
                        <input type="color" name="email" id="email" class="form-control form-control-color rounded-0" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="country" class="form-label">Country</label>
                        <select name="country" id="country" class="form-select form-select-sm rounded-0">
                            <option selected disabled>Choose Country</option>
                            <option value="mm">Myanmar</option>
                            <option value="th">Thailand</option>
                            <option value="slk">Srilanka</option>
                            <option value="indo">Indonesia</option>                            
                        </select>

                        <!-- form-select-lg
                             form-select-md
                            form-select-sm 
                        -->
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="roles" class="form-label">Roles</label>
                        <select name="roles" id="roles" class="form-select rounded-0" size="2" multiple>
                            <option value="mm">Admin</option>
                            <option value="th">Manager</option>
                            <option value="slk">Supervisor</option>
                            <option value="indo">Editor</option>                            
                            <option value="indo">Viewer</option>                            
                            <option value="indo">Subscriber</option>                            
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="searchcity" class="form-label">Search By City</label>
                        <input type="text" id="searchcity" name="searchcity" class="form-control" placeholder="Type to search..." list="samplecities" />
                        <datalist id="samplecities">                            
                            <option value="Myanmar">
                            <option value="Thailand">
                            <option value="Srilanka">
                            <option value="Indonesia">
                        </datalist>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Gender</label>
                        <div class="form-check">
                            <input type="radio" name="gender" id="genderm" class="form-check-input" value="1"><label for="genderm" class="form-check-label">Male</label>
                        </div>
                        <div class="form-check">
                            <input type="radio" name="gender" id="genderf" class="form-check-input" value="0"><label for="genderf" class="form-check-label">Female</label>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Fav Music</label>
                        <div class="form-check">
                            <input type="checkbox" name="favmusic" id="favpop" class="form-check-input" value="1"><label for="favpop" class="form-check-label">Pop</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="favmusic" id="favrock" class="form-check-input" value="1"><label for="favrock" class="form-check-label">Rock</label>
                        </div>
                        <div class="form-check">
                            <input type="checkbox" name="favmusic" id="favhiphop" class="form-check-input" value="1"><label for="favhiphop" class="form-check-label">Hip Hop</label>
                        </div>
                    </div>  

                    <div class="col-md-6 mb-3">
                        <label for="dob" class="form-label">Date of Birth</label>
                        <input type="date" name="dob" id="dob" class="form-control rounded-0" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="nrc" class="form-label">NRC</label>
                        <input type="file" name="nrc" id="nrc" class="form-control rounded-0" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="score" class="form-label">Score</label>
                        <input type="range" name="score" id="score" class="form-range" min="0" max="100" step="10" value="0" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <div class="input-group input-group-lg">
                            <span class="input-group-text">@</span>
                            <input type="text" name="username" id="username" class="form-control" placeholder="Username" />
                        </div>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <div class="input-group input-group-sm">
                            <input type="text" name="useraccount" id="useraccount" class="form-control" placeholder="useraccount" />
                            <span class="input-group-text">@icloude.com</span>
                        </div>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label for="bio" class="form-label">Bio</label>
                        <textarea name="bio" id="bio" class="form-control rounded-0" rows="3"></textarea>
                    </div>

                    <div class="col-md-12 mb-3">
                        <div class="d-flex justify-content-end  ">
                            <button type="reset" class="btn btn-secondary btn-sm rounded-0 me-3">Cancel</button>
                            <button type="submit" class="btn btn-primary btn-sm rounded-0">Register</button>
                        </div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <div class="form-check form-switch">
                            <input type="checkbox" name="agree" id="agree" class="form-check-input" value="1">
                            <label for="agree">I agree all the above regulation</label>
                        </div>
                        
                    </div>  

                </div>

            </form>


        </div>

       

        


        <!-- bootstrap css1 js1 -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- jQuery -->
        <script src="./libs/jquery-4.0.0.js" type="text/javascript"></script> 

        <!-- select2 css1 js1 -->
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>

        <!-- flatpicker css1 js1 -->
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

        <!-- summernote css1 js1 -->
        <script src="https://cdn.jsdelivr.net/npm/summernote@0.9.0/dist/summernote-lite.min.js"></script>

        <script type="text/javascript">
            $(document).ready(function(){
                
                // for role 
                $('#roles').select2({
                    placeholder:'Select Role'
                });

                // for dob 
                $("#dob").flatpickr({
                    // enableTime: true,
                    // dateFormat: "Y-m-d H:i",

                    // minDate:"2022-1"
                    // minDate:"2022-10-20"

                    // minDate:"today",
                    // minDate:"2026-10-14"

                    // maxDate:"today"
                    // maxDate:"2001"
                });

                // bio 
                $('#bio').summernote({
                    placeholder:'Write Something...',
                });
            });
        </script>
    </body>
    
</html>
