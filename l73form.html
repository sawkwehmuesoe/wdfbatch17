<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 , Form </title> 
        <!-- bootstrap css1 js1 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
       
    </head>
    <body class="">

        <div class="container">

            <h1>Bootstrap Form Elements</h1>

            <form action="" method="" enctype="Multipart/form-data" >

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label for="firstname">First Name</label>
                        <input type="text" name="firstname" id="firstname" class="form-control" placeholder="Enter Your Firstname" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="lastname">Last Name</label>
                        <input type="text" name="lastname" id="lastname" class="form-control" placeholder="Enter Your Lastname" />
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="age">Age</label>
                        <input type="number" name="age" id="age" class="form-control" placeholder="Enter Your Age" />
                    </div>

                </div>

            </form>


        </div>

       

        


        <!-- bootstrap css1 js1 -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <!-- jQuery -->
        <script src="./libs/jquery-4.0.0.js" type="text/javascript"></script> 

        <script type="text/javascript">
            $(document).ready(function(){
                $('.table').DataTable();
            });
        </script>
    </body>
    
</html>
