<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 , Horizontal Aligment</title> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <style type="text/css">
            .row{
                height: 100px;
                background: silver;
            }
        </style>
    </head>
    <body class="">

        <div class="container">
            <h1>Horizontal Aligment</h1>
        </div>

        <div class="container">

            <div class="row text-light justify-content-start">
                <div class="col-2 bg-primary">Column 1</div>
                <div class="col-2 bg-info">Column 2</div>
                <div class="col-2 bg-success">Column 3</div>
            </div>

            <hr>

            <div class="row text-light justify-content-center">
                <div class="col-2 bg-primary">Column 1</div>
                <div class="col-2 bg-info">Column 2</div>
                <div class="col-2 bg-success">Column 3</div>
            </div>

            <hr>

            <div class="row text-light justify-content-end">
                <div class="col-2 bg-primary">Column 1</div>
                <div class="col-2 bg-info">Column 2</div>
                <div class="col-2 bg-success">Column 3</div>
            </div>


        </div>
       



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    
</html>
