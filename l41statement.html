            // (i) ternary operator (?)
            // c1 statement c2 ? true : false;


            const x = 100;
            const y = 200;

            console.log( x > y ? "Yes, it is true" : "No, it is false"); // No, it is false
            console.log( x < y ? "Yes, it is true" : "No, it is false"); // Yes, it is true

            // c1 > c2 ? true : ( c1 == c2 ) ? true : false;
            console.log(x == y ? "X is equal to Y" : (x < y) ? "X is less than Y" : "Y is greater than X");

            // check value
