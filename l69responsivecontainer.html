<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 , Reponsive Container</title> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="">

        <div>
            <h1>Without Container</h1>
            <hr/>
        </div>

        <div class="container">
            <h1>With Container</h1>
            <hr/>
        </div>

        <div class="container-fluid">
            <h1>With Container Fluid</h1>
            <hr/>
        </div>

        <hr/>

        <div class="container-xxl">This is xxl container work for xxl size</div>
        <div class="container-xl">This is xl container work for xl size</div>
        <div class="container-lg">This is lg container work for lg size</div>
        <div class="container-md">This is md container work for md size</div>
        <div class="container-sm">This is sm container work for sm size</div>
        <div class="container">This is fixed container work for fixed size</div>
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    
</html>
