<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Function Exercise</title>

        <style type="text/css">

         
        </style>
    </head>
    <body>

      

        <script type="text/javascript">
        
            function outerfun(){
                function innerfun(){
                    console.log("Hello i am inner function");
                }

                innerfun();
            }

            outerfun();


            function greet(){
                return function(){
                    return "Hello Sir";
                }
            }

            let getgreet = greet(); 
            let message = getgreet();

            console.log(message);

            console.log(greet()());


            function welcomefun(name){
                return function(){
                    return `Welcome , ${name}`;
                }
            }

            let welcomeagag = welcomefun("Aung Aung");
            console.log(welcomeagag()); // Welcome , Aung Aung


            function addfun(x){
                return function(y){
                    return x + y;
                }
            }

            let getaddfun = addfun(10);
            console.log(getaddfun(20)); // 30

            console.log(addfun(50)(100)); // 150


            const multifun = num1 => num2 => num1 * num2;

            let getmultifun = multifun(5);
            let resultone = getmultifun(2);

            console.log(resultone); // 10 


            let resulttwo = multifun(50)(2);
            console.log(resulttwo);
 
        </script>

    </body>
</html>
