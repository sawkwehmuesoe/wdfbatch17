<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Bootstrap V5 , Progress Bar</title> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body class="">

        <div class="container">
            
            <h3>Progress Bar</h3>

            <div class="progress">
                <div class="progress-bar bg-danger" style="width:25%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" ></div>
            </div>

            <br/>

            <div class="progress">
                <div class="progress-bar bg-warning" style="width:50%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" ></div>
            </div>

            <br/>

            <div class="progress">
                <div class="progress-bar bg-success" style="width:75%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" ></div>
            </div>  

            <br/>

            <h3>Progress Bar with Value / Striped</h3>

            <div class="progress">
                <div class="progress-bar bg-primary" style="width:30%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" >30%</div>
            </div>

            <br/>

            <div class="progress">
                <div class="progress-bar progress-bar-striped bg-info" style="width:50%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" >50%</div>
            </div>

            <br/>

            <div class="progress">
                <div class="progress-bar progress-bar-striped bg-danger progress-bar-animated" style="width:90%;" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100" >90%</div>
            </div>

            <br/>

            <h3>Multi Progress Bar / Height</h3>

            <div class="progress-stacked" style="height: 10px;">
                <div class="progress-bar bg-danger" style="width:10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100" >10%</div>
                <div class="progress-bar bg-warning" style="width:30%;" aria-valuenow="30" aria-valuemin="0" aria-valuemax="100" >30%</div>
                <div class="progress-bar bg-info" style="width:10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100" >10%</div>
                <div class="progress-bar bg-success" style="width:20%;" aria-valuenow="20" aria-valuemin="0" aria-valuemax="100" >20%</div>
            </div>

            <br/>

        </div>

        
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
    
</html>
